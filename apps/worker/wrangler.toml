# Camelthorn Finance Worker: HTTP API plus static web app, the scheduler and the Exact Durable Objects.
# PLACEHOLDERS below must be filled in before the first deploy:
#   database_id (EU D1), routes, GOOGLE_CLIENT_ID, OAUTH_REDIRECT_URI,
#   EXACT_CLIENT_ID, EXACT_REDIRECT_URI (same origin as OAUTH_REDIRECT_URI, fixed path),
#   Revolut is OPTIONAL as a whole: leave REVOLUT_CLIENT_ID, REVOLUT_REDIRECT_URI and REVOLUT_ISSUER
#   all empty and the deploy guard passes with a notice (the Revolut routes answer
#   server_misconfigured and the Revolut jobs stay off). To use Revolut set ALL THREE:
#   REVOLUT_CLIENT_ID, REVOLUT_REDIRECT_URI (same origin as OAUTH_REDIRECT_URI, fixed path) and
#   REVOLUT_ISSUER (the host of REVOLUT_REDIRECT_URI), plus the secret REVOLUT_PRIVATE_KEY.
# Secrets are never in this file: GOOGLE_CLIENT_SECRET, SESSION_SECRET, EXACT_CLIENT_SECRET,
# REVOLUT_PRIVATE_KEY (PKCS#8 PEM) and TOKEN_ENC_KEY (and TOKEN_ENC_KEY_PREVIOUS while rotating)
# go in with `wrangler secret put`.
# Also required and checked by the deploy guard:
#   - [triggers] crons = ["* * * * *"]: the scheduler tick, once a minute (do not change it);
#   - the ExactGate Durable Object binding with migration tag v1 (sqlite), the JobLock binding
#     (per-job no-overlap lease, ADR 0021) with migration tag v2, and the RevolutGate binding
#     (ADR 0031) with migration tag v3; never reuse or edit a deployed tag;
#   - the JOBS_QUEUE producer, the consumer and its dead_letter_queue. Create both queues first, in
#     the EU: `wrangler queues create camelthorn-jobs --jurisdiction eu` and the same for
#     camelthorn-jobs-dlq (ADR 0028). The producer/consumer tables have no jurisdiction field in
#     wrangler 4.160's schema; they name the queue only (UNVERIFIED that this resolves a
#     jurisdiction queue, first-deploy checklist in docs/DEPLOY.md).
#   - [env.staging], a complete second set of resources (own Worker name, D1 database, queues,
#     Durable Objects), for running the first-live checks away from production (ADR 0029). The
#     guard refuses a staging that shares anything with production.
# Durable Objects are always created in the EU jurisdiction by code (ADR 0018); D1 is created with
# --jurisdiction eu and that cannot be changed later.
# Deploy with `pnpm --filter @camelthorn/worker run deploy` (staging: `run deploy:staging`), which
# runs scripts/check-deploy-config.mjs and refuses while any placeholder is left. The ordered
# runbook, including queue creation, secrets and first-deploy checks, is docs/DEPLOY.md.
name = "camelthorn-finance"
main = "src/index.ts"
compatibility_date = "2026-08-01"
compatibility_flags = ["nodejs_compat"]

# Only reachable through your own route / custom domain (see below). The *.workers.dev
# hostname and per-version preview URLs would bypass the OAUTH_REDIRECT_URI origin and are off.
workers_dev = false
preview_urls = false

# Production route. Uncomment and set your zone/hostname before the first deploy (docs/DEPLOY.md).
# The hostname must match the origin of OAUTH_REDIRECT_URI below.
# routes = [{ pattern = "app.example.com", custom_domain = true }]
# or, on an existing proxied hostname:
# routes = [{ pattern = "app.example.com/*", zone_name = "example.com" }]

# The scheduler tick (Phase 3): every minute (UTC). The Worker decides from each job's own schedule
# (Europe/Amsterdam, daylight saving aware) which jobs are due, claims a run in D1 and puts it on the
# Queue below. Do not change this expression; change a job's schedule in Settings, Schedules.
[triggers]
crons = ["* * * * *"]

# Logs (review S7). Request URLs carry customer names (`?q=` search) and the OAuth `code`, so:
#   - redact_query_string removes query strings from URLs in logs and traces;
#   - invocation_logs = false turns off the automatic per-request log line. The application's own
#     console output (reason codes only, never tokens or IBANs) is still kept.
# Whether Cloudflare redacts everything this way is UNVERIFIED until checked in the dashboard
# (docs/DEPLOY.md, Log hygiene). The deploy guard refuses invocation logs at sampling above 0.05.
[observability]
enabled = true
head_sampling_rate = 1
redact_query_string = true

[observability.logs]
invocation_logs = false

# CPU time per invocation (milliseconds). 30000 is Cloudflare's default; it is written out so a
# change is a reviewed diff. A full Exact pass is bounded by the 1,000-subrequest and 60-call/minute
# limits and runs in resumable chunks, so 30 s of CPU is ample; raise it (maximum 300000) only if a
# live run shows CPU-limit errors (docs/DEPLOY.md, step 10 item 11).
[limits]
cpu_ms = 30000

[assets]
directory = "../web/dist"
not_found_handling = "single-page-application"
run_worker_first = ["/api/*"]
binding = "ASSETS"

[vars]
# Seeded as the initial admin when the Worker starts, at most once per database (a settings marker
# makes re-runs no-ops; see apps/worker/src/db/seed.ts). It is not a SQL migration because D1
# migrations cannot read Workers variables (CLAUDE.md 4.0).
# Read from this variable only; never hard-code it in source.
INITIAL_ADMIN_EMAIL = "gerrie.grobbelaar@camelthorncapital.com"
ALLOWED_HD = "camelthorncapital.com"
# PLACEHOLDER. Google OAuth client ID (public). Empty until the Google Cloud project exists; while
# empty, every route except /api/health answers 500 server_misconfigured. Secrets are not here,
# see apps/worker/README.md and docs/DEPLOY.md.
GOOGLE_CLIENT_ID = ""
# PLACEHOLDER (app.example.com). Must equal an authorised redirect URI of the Google OAuth client;
# its origin is also the CSRF origin. For local dev override it in .dev.vars, see
# .dev.vars.example (do not edit this value for local work).
OAUTH_REDIRECT_URI = "https://app.example.com/api/auth/callback"
# PLACEHOLDER. Client ID of the Exact Online app registration (apps.exactonline.com). Empty until
# the app exists; while empty, /api/connections/exact/* answers 500 server_misconfigured.
EXACT_CLIENT_ID = ""
# PLACEHOLDER (app.example.com). Must equal the redirect URI registered on the Exact app and live on
# the same origin as OAUTH_REDIRECT_URI: https://<app host>/api/connections/exact/callback
EXACT_REDIRECT_URI = "https://app.example.com/api/connections/exact/callback"
# OPTIONAL (all three REVOLUT_* settings empty = Revolut not used; set all three or none).
# Client ID of the Revolut Business API certificate (Revolut Business, Settings, APIs). While
# empty, /api/connections/revolut/* answers 500 server_misconfigured. The private key is the secret
# REVOLUT_PRIVATE_KEY.
REVOLUT_CLIENT_ID = ""
# Registered as the OAuth redirect URI on the Revolut API certificate; same origin as
# OAUTH_REDIRECT_URI: https://<app host>/api/connections/revolut/callback
REVOLUT_REDIRECT_URI = ""
# The `iss` of the client assertion: the HOST of REVOLUT_REDIRECT_URI, without https://
# (Revolut's rule).
REVOLUT_ISSUER = ""

[[d1_databases]]
binding = "DB"
database_name = "camelthorn-finance"
# PLACEHOLDER (all zeros). Create the database with EU jurisdiction and paste the real id here:
#   wrangler d1 create camelthorn-finance --jurisdiction eu
# The jurisdiction cannot be changed later. See docs/DEPLOY.md.
database_id = "00000000-0000-0000-0000-000000000000"
migrations_dir = "migrations"

# One ExactGate per Exact division ("exact:<division>") plus one token authority per connection.
[[durable_objects.bindings]]
name = "EXACT_GATE"
class_name = "ExactGate"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["ExactGate"]

# One JobLock per job name ("job:<name>"): the no-overlap lease (ADR 0021).
[[durable_objects.bindings]]
name = "JOB_LOCK"
class_name = "JobLock"

[[migrations]]
tag = "v2"
new_sqlite_classes = ["JobLock"]

# One RevolutGate per Revolut connection ("revolut:<connection id>"): rate limit, per-job budgets
# and the token refresh (ADR 0031).
[[durable_objects.bindings]]
name = "REVOLUT_GATE"
class_name = "RevolutGate"

[[migrations]]
tag = "v3"
new_sqlite_classes = ["RevolutGate"]

# Job runs. Create both queues once before the first deploy, in the EU (docs/DEPLOY.md, ADR 0028):
#   wrangler queues create camelthorn-jobs --jurisdiction eu
#   wrangler queues create camelthorn-jobs-dlq --jurisdiction eu
[[queues.producers]]
binding = "JOBS_QUEUE"
queue = "camelthorn-jobs"

[[queues.consumers]]
queue = "camelthorn-jobs"
# One run per invocation: each run has its own subrequest budget and 15-minute wall-time limit.
max_batch_size = 1
max_batch_timeout = 1
# A run that cannot be started is retried a few times, then parked in the dead-letter queue; the
# scheduler's sweep marks such a run as an error after a while.
max_retries = 3
retry_delay = 60
dead_letter_queue = "camelthorn-jobs-dlq"

# ---------------------------------------------------------------------------------------------
# Staging (ADR 0029): `wrangler deploy --env staging` (via `pnpm run deploy:staging`, which runs the
# guard first). Environments do not inherit bindings or vars (d1_databases, queues, durable_objects,
# vars), so those are written out again. They DO inherit routes, triggers, observability, limits,
# assets, migrations, workers_dev and preview_urls from the top level when not set here; every one of
# those is written out below as well, so nothing silently comes from production. Nothing
# is shared with production: own Worker, D1 database, queues and Durable Object namespaces (a
# Durable Object namespace belongs to its Worker, so a separate Worker name means separate state).
# Fill the placeholders with a TEST Exact division and, preferably, a Google client with its own
# redirect URI. Secrets are per Worker: repeat `secret put` with `--env staging`.
# ---------------------------------------------------------------------------------------------
[env.staging]
name = "camelthorn-finance-staging"
workers_dev = false
preview_urls = false
# PLACEHOLDER. Replace with the staging hostname (never the production one), for example
#   routes = [{ pattern = "staging.example.com", custom_domain = true }]
# Keep the key even while empty: an environment without `routes` inherits the top-level routes, and
# a staging deploy would then take over the production hostname (wrangler 4.160 only warns). The
# deploy guard refuses an empty list and any route shared with production.
routes = []

[env.staging.triggers]
crons = ["* * * * *"]

[env.staging.observability]
enabled = true
head_sampling_rate = 1
redact_query_string = true

[env.staging.observability.logs]
invocation_logs = false

[env.staging.limits]
cpu_ms = 30000

[env.staging.assets]
directory = "../web/dist"
not_found_handling = "single-page-application"
run_worker_first = ["/api/*"]
binding = "ASSETS"

[env.staging.vars]
INITIAL_ADMIN_EMAIL = "gerrie.grobbelaar@camelthorncapital.com"
ALLOWED_HD = "camelthorncapital.com"
# PLACEHOLDER. Google OAuth client ID (the production client works if it has the staging redirect URI).
GOOGLE_CLIENT_ID = ""
# PLACEHOLDER (staging.example.com). Must differ from production and be registered on the Google client.
OAUTH_REDIRECT_URI = "https://staging.example.com/api/auth/callback"
# PLACEHOLDER. Exact app client ID (the same app registration may be used with an extra redirect URI).
EXACT_CLIENT_ID = ""
# PLACEHOLDER (staging.example.com). Same origin as the staging OAUTH_REDIRECT_URI.
EXACT_REDIRECT_URI = "https://staging.example.com/api/connections/exact/callback"
# OPTIONAL (all three empty = Revolut not used). Revolut API certificate client ID (use a SANDBOX
# certificate for staging).
REVOLUT_CLIENT_ID = ""
# Same origin as the staging OAUTH_REDIRECT_URI: https://<staging host>/api/connections/revolut/callback
REVOLUT_REDIRECT_URI = ""
# The host of the staging REVOLUT_REDIRECT_URI.
REVOLUT_ISSUER = ""

[[env.staging.d1_databases]]
binding = "DB"
database_name = "camelthorn-finance-staging"
# PLACEHOLDER (all zeros). Create it separately, never reuse the production id:
#   wrangler d1 create camelthorn-finance-staging --jurisdiction eu
database_id = "00000000-0000-0000-0000-000000000000"
migrations_dir = "migrations"

[[env.staging.durable_objects.bindings]]
name = "EXACT_GATE"
class_name = "ExactGate"

[[env.staging.durable_objects.bindings]]
name = "JOB_LOCK"
class_name = "JobLock"

[[env.staging.durable_objects.bindings]]
name = "REVOLUT_GATE"
class_name = "RevolutGate"

[[env.staging.migrations]]
tag = "v1"
new_sqlite_classes = ["ExactGate"]

[[env.staging.migrations]]
tag = "v2"
new_sqlite_classes = ["JobLock"]

[[env.staging.migrations]]
tag = "v3"
new_sqlite_classes = ["RevolutGate"]

# Create both in the EU first:
#   wrangler queues create camelthorn-jobs-staging --jurisdiction eu
#   wrangler queues create camelthorn-jobs-staging-dlq --jurisdiction eu
[[env.staging.queues.producers]]
binding = "JOBS_QUEUE"
queue = "camelthorn-jobs-staging"

[[env.staging.queues.consumers]]
queue = "camelthorn-jobs-staging"
max_batch_size = 1
max_batch_timeout = 1
max_retries = 3
retry_delay = 60
dead_letter_queue = "camelthorn-jobs-staging-dlq"
